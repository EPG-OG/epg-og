# Rebuilds the guide JSON every 6 hours and publishes it to GitHub Pages, along with the
# landing page, privacy policy and version.json (the newest APK release, for the in-app
# "new version available" banner).
name: Update EPG

on:
  schedule:
    - cron: '15 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Publish new listings even if they look wrong (e.g. after removing many channels)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      problem: ${{ steps.check.outputs.problem }}
      web: ${{ steps.web.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # If the feed can't be downloaded, the check below keeps the live listings.
      - run: node scripts/build-epg.mjs --out _site
        continue-on-error: true
      - id: check
        env:
          FORCE: ${{ inputs.force }}
        run: node scripts/check-listings.mjs _site https://epgog.com
      # Landing page + privacy policy (the Play Store needs a public privacy policy URL)
      - run: cp site/* _site/
      # The browser version of the app at epgog.com/app, rebuilt every run so it always matches the code.
      # If this fails, the listings and front page still publish; the alert below emails about it.
      - run: npm ci
        id: deps
        continue-on-error: true
      # The front page's race, from the same code as the browser version's. Optional: without it the
      # front page just doesn't show the race.
      - name: Build the front page race
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: node scripts/build-race.mjs _site/race.js
      - name: Build the browser version
        id: web
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        env:
          EXPO_WEB_BASE_URL: /app
          EXPO_PUBLIC_DISTRIBUTION: github
        run: |
          npx expo export --platform web --output-dir _site/app
          # Kept out of search results: people find EPG OG through the front page instead.
          sed -i 's#<head>#<head><meta name="robots" content="noindex">#' _site/app/index.html
          grep -q 'name="robots"' _site/app/index.html
      - name: Drop a half-built browser version
        if: steps.web.outcome != 'success'
        run: rm -rf _site/app
      - name: Write version.json from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "${{ github.repository }}" --json tagName,url \
            --jq '{version: (.tagName | ltrimstr("v")), notesUrl: .url, apkUrl: "https://epgog.com/download"}' \
            > _site/version.json || rm -f _site/version.json
          cat _site/version.json 2>/dev/null || echo "no release yet"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Fails on purpose when the listings check held something back or the browser version didn't
  # build, so GitHub sends an email. The rest of the site has still been published.
  alert:
    needs: [build, deploy]
    if: always() && (needs.build.outputs.problem != '' || needs.build.outputs.web != 'success')
    runs-on: ubuntu-latest
    steps:
      - env:
          PROBLEM: ${{ needs.build.outputs.problem }}
          WEB: ${{ needs.build.outputs.web }}
        run: |
          if [ -n "$PROBLEM" ]; then echo "::error::Listings problem: $PROBLEM"; fi
          if [ "$WEB" != "success" ]; then echo "::error::The browser version at epgog.com/app didn't build ($WEB), so it's missing from the site."; fi
          exit 1

  # GitHub pauses scheduled workflows after 60 days without repository activity.
  # Re-enabling the workflow through the API resets that timer, so the listings never stop.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/epg.yml/enable"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EPG OG</title>
<script>
  // The browser version's screens (like /app/uk) aren't separate files, so opening one directly
  // lands here: send those visitors to the guide instead. (Not from /app/ itself, or a missing
  // browser version would send the page round in circles.)
  const p = location.pathname;
  if (p.startsWith('/app/') && p !== '/app/') location.replace('/app/');
</script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14161a; color: #f2f3f5; font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  a { color: #3ea4f0; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p><a href="/">Go to EPG OG</a></p>
</main>
</body>
</html>
